<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibecipes - Canvas Photo OCR Crop Tool Prototype (Issue #8)</title>
    <style>
      :root {
        --bg: #0b0f19;
        --card: #161f30;
        --card-border: #23324a;
        --text: #f8fafc;
        --muted: #94a3b8;
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --accent: #06b6d4;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding-bottom: 80px;
      }
      header {
        background: rgba(22, 31, 48, 0.8);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--card-border);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.6rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: rgba(99, 102, 241, 0.2);
        color: var(--primary);
        border: 1px solid rgba(99, 102, 241, 0.4);
      }
      .app-title {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .app-title h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
      }
      nav a {
        color: var(--muted);
        text-decoration: none;
        margin-left: 1rem;
        font-size: 0.9rem;
        transition: color 0.2s;
      }
      nav a:hover { color: var(--text); }
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 1.5rem;
      }

      /* Utility classes for prototype UI */
      .btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .btn:hover { background: var(--primary-hover); }
      .btn-secondary {
        background: #1e293b;
        border: 1px solid var(--card-border);
        color: var(--text);
      }
      .btn-secondary:hover { background: #334155; }
      .btn-danger { background: var(--danger); }
      .btn-danger:hover { background: #dc2626; }
      
      input[type="range"] {
        accent-color: var(--primary);
      }

      /* Prototype Switcher Floating Bar */
      #prototype-switcher {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #0f172a;
        border: 2px solid var(--primary);
        border-radius: 9999px;
        padding: 0.5rem 1.25rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(99, 102, 241, 0.4);
        z-index: 1000;
        user-select: none;
      }
      #prototype-switcher button {
        background: rgba(99, 102, 241, 0.2);
        border: 1px solid var(--primary);
        color: white;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }
      #prototype-switcher button:hover { background: var(--primary); }
      .switcher-label {
        font-weight: 600;
        font-size: 0.9rem;
        color: #e2e8f0;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="app-title">
        <span class="badge">Prototype #8</span>
        <h1>Vibecipes Photo OCR Canvas Crop Tool</h1>
      </div>
      <nav>
        <a href="/">← Back to Main App</a>
      </nav>
    </header>

    <main class="container">
      <div id="variant-container"></div>
    </main>

    <div id="prototype-switcher">
      <button id="prev-variant" title="Previous Variant (←)">←</button>
      <span class="switcher-label" id="current-variant-label">Loading Variant...</span>
      <button id="next-variant" title="Next Variant (→)">→</button>
    </div>

    <script type="module" src="./ocr-crop.ts"></script>
  </body>
</html>
