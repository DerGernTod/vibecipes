<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibecipes Web Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Inter:wght@400..700&display=swap" rel="stylesheet" />
    <style>
      .lang-toggle-group {
        display: flex;
        background: var(--surface-inset);
        border: 1px solid var(--card-border);
        border-radius: 6px;
        padding: 2px;
        gap: 2px;
      }
      .lang-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        padding: 0.3rem 0.6rem;
        font-size: 0.8rem;
        font-weight: 600;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .lang-btn:hover {
        color: var(--text);
      }
      .lang-btn.active {
        background: var(--fill);
        color: var(--on-fill);
      }
      pre {
        background: var(--surface-inset);
        padding: 1rem;
        border-radius: 6px;
        overflow-x: auto;
        color: #38bdf8;
      }
      ul { padding-left: 1.2rem; }
      li { margin-bottom: 0.5rem; }



      .ingredient-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1rem;
        max-height: 600px;
        overflow-y: auto;
        padding-right: 0.25rem;
      }


      .trait-badge {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.2rem 0.45rem;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }
      .trait-vegan {
        background: color-mix(in srgb, var(--vegan) 18%, var(--surface-inset));
        color: var(--vegan);
        border: 1px solid color-mix(in srgb, var(--vegan) 32%, transparent);
      }
      .trait-vegetarian {
        background: color-mix(in srgb, var(--vegetarian) 18%, var(--surface-inset));
        color: var(--vegetarian);
        border: 1px solid color-mix(in srgb, var(--vegetarian) 32%, transparent);
      }
      .trait-omnivore {
        background: color-mix(in srgb, var(--omnivore) 18%, var(--surface-inset));
        color: var(--omnivore);
        border: 1px solid color-mix(in srgb, var(--omnivore) 32%, transparent);
      }

      .trait-unverified {
        background: color-mix(in srgb, var(--unverified) 18%, var(--surface-inset));
        color: var(--text-soft);
        border: 1px solid color-mix(in srgb, var(--unverified) 32%, transparent);
      }


      /* Recipe List & Grid */
      .recipe-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
      }
      .recipe-card {
        background: var(--surface-inset);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 1rem;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      .recipe-card:hover {
        transform: translateY(-2px);
        border-color: var(--primary);
      }


    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
