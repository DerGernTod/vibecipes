<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibecipes Web Platform</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --primary: #6366f1;
        --success: #10b981;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 2rem;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        background: rgba(99, 102, 241, 0.2);
        color: var(--primary);
      }
      .card {
        background: var(--card);
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 1.5rem;
        margin-top: 1rem;
      }
      pre {
        background: #090d16;
        padding: 1rem;
        border-radius: 6px;
        overflow-x: auto;
        color: #38bdf8;
      }
      ul { padding-left: 1.2rem; }
      li { margin-bottom: 0.5rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
